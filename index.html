<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Social links profile</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
    body{
      background-color: hsl(0, 0%, 8%);
      font-family: Inter,sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card{
      background-color: hsl(0, 0%, 12%);
      padding: 24px;
      width: 90%;
      max-width: 320px;
      text-align: center;
      border-radius: 12px;
    }
    .card img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      margin-bottom: 16px;
    }
    .card h2{
      color: hsl(0, 0%, 100%);
      font-weight: 700;
      margin-bottom: 0px;
    }
    .card .p1{
      color: hsl(75, 94%, 57%);
      font-weight: 600;
      font-size: 14px;
    }
    .card .p2{
      color: hsl(0, 0%, 100%);
      font-weight: 400;
      font-size: 14px;
      margin-top: 30px;
    }
    button{
      background-color: hsl(0, 0%, 20%);
      color: hsl(0, 0%, 100%);
      height: 44px;
      width: 90%;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 12px;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="card">

    <img src="assets/images/avatar-jessica.jpeg" alt="image not found" width="100" height="100">
    
    <h2>Jessica Randall</h2>
    <p class="p1">London,United Kingdom</p>
    <p class="p2">"Front-end developer and avid reader."</p>
    
    <button>GitHub</button>
    <button>Frontend Mentor</button>
    <button>LinkedIn</button>  
    <button>Twitter</button>
    <button>Instagram</button>
    <footer class="attribution">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
      Coded by <a href="https://www.frontendmentor.io/profile/MrwanAmr185">Mrwan Amr -EngiCtor-</a>.
    </footer>
  </div>
</body>
</html>
